<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#D40000" />
    <title>Settimo Milanese Team Manager</title>
    <link rel="icon" href="/favicon-32.png" sizes="32x32" />
    <link rel="icon" href="/icon-192.png" sizes="192x192" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Settimo" />
    <meta name="description" content="Gestione della prima squadra del Settimo Milanese." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  </head>
  <body>
    <!-- Mostrato prima che l'applicazione sia pronta: l'ultimo logo usato viene
         ricordato dal browser, così all'apertura compare lo stemma vero. -->
    <div id="splash">
      <img id="splash-logo" src="/logo.png" alt="" />
      <div id="splash-name">Settimo Milanese</div>
      <div id="splash-bar"><span></span></div>
    </div>
    <script>
      (function () {
        try {
          var url = localStorage.getItem('sm-logo');
          if (url) document.getElementById('splash-logo').src = url;
          var name = localStorage.getItem('sm-club');
          if (name) document.getElementById('splash-name').textContent = name;
          if (localStorage.getItem('sm-theme') === 'dark') document.documentElement.dataset.theme = 'dark';
        } catch (e) { /* niente di grave */ }
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
