# Scarica i comunicati ufficiali e i programmi gare del CRL Lombardia e ne
# salva il testo sul ramo `crl-cache` (non su main, così Cloudflare non
# ricompila il sito). I task programmati di Claude leggono da quel ramo.
# Dai comunicati ricava anche classifica e risultati di Prima Categoria
# girone A (public/data/girone.json su main), usati dalla scheda Avversari.
name: Cache comunicati CRL

on:
  schedule:
    # Orari UTC: 04:40 e 17:40 = 06:40 e 19:40 in Italia (05:40 e 18:40 con l'ora solare)
    - cron: "40 4 * * *"
    - cron: "40 17 * * *"
  workflow_dispatch:
    inputs:
      backfill:
        description: "Recupera anche i comunicati più vecchi: intervallo di id delle pagine /documenti (es. 33380-33600)"
        required: false
        default: ""
  push:
    branches: [crl-backfill]

permissions:
  contents: write

concurrency:
  group: crl-cache
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Codice dello script (main)
        uses: actions/checkout@v4
        with:
          path: src
          ref: main

      - name: Ramo crl-cache
        run: |
          set -e
          url="https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
          if git ls-remote --exit-code --heads "$url" crl-cache >/dev/null; then
            git clone --depth 1 --branch crl-cache "$url" cache
          else
            mkdir cache && cd cache && git init -q -b crl-cache && git remote add origin "$url"
          fi

      - name: pdftotext
        run: |
          which pdftotext || (sudo apt-get update -q && sudo apt-get install -y -q poppler-utils)

      - name: Scarica i documenti
        env:
          BACKFILL: ${{ github.event.inputs.backfill || '33575-33622' }}
        run: |
          if [ -n "$BACKFILL" ]; then
            python3 -I src/scripts/crl_cache.py cache --backfill "$BACKFILL"
          else
            python3 -I src/scripts/crl_cache.py cache
          fi

      - name: Pubblica sul ramo crl-cache
        working-directory: cache
        run: |
          set -e
          cp ../src/scripts/crl_cache_README.md README.md
          git config user.name "crl-cache bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Cache CRL $(TZ=Europe/Rome date '+%d/%m %H:%M') [skip ci]" || { echo "Nessuna modifica"; exit 0; }
          git push -q origin HEAD:crl-cache

      - name: Classifica e risultati del girone (main)
        working-directory: src
        run: |
          set -e
          python3 -I scripts/crl_girone.py ../cache public/data/girone.json
          git add public/data/girone.json
          if git diff --cached --quiet; then echo "Girone invariato"; exit 0; fi
          git config user.name "crl-cache bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -q -m "Girone A: classifica e risultati dai comunicati CRL"
          for i in 1 2 3; do
            git pull -q --rebase origin main && git push -q origin HEAD:main && exit 0
            sleep 10
          done
          exit 1
